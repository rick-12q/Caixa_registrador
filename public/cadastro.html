<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">Controle de Vendas</div>
    <nav>
      <a class="active" href="/cadastro.html">Cadastro</a>
      <a href="/resumo.html">Resumo</a>
      <a href="/">Venda rápida</a>
    </nav>
  </div>
</header>
<main>
  <div class="page-title">
    <h1>Cadastro de produtos</h1>
    <p>Cadastre ou altere nome, preço e quantidade em estoque.</p>
  </div>
  <div id="notice" class="notice"></div>

  <div class="grid grid-2">
    <section class="card">
      <h2 id="formTitle">Novo produto</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <div class="form-group">
          <label for="name">Produto</label>
          <input id="name" maxlength="120" required placeholder="Ex.: Refrigerante lata">
        </div>
        <div class="form-group">
          <label for="price">Preço de venda (R$)</label>
          <input id="price" type="number" min="0" step="0.01" required placeholder="0,00">
        </div>
        <div class="form-group">
          <label for="stock">Quantidade em estoque</label>
          <input id="stock" type="number" min="0" step="1" required placeholder="0">
        </div>
        <div class="form-actions">
          <button class="btn-primary" type="submit">Salvar produto</button>
          <button class="btn-secondary" id="cancelEdit" type="button" style="display:none">Cancelar edição</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Produtos cadastrados</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="productTable"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<footer>Controle de Vendas</footer>
<script src="/common.js"></script>
<script src="/cadastro.js"></script>
</body>
</html>
